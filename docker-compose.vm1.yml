version: '3.8'

services:
  iii-engine:
    image: lizzycloudlab/iii-engine:latest
    container_name: iii-engine
    restart: unless-stopped
    ports:
      - "49134:49134"
      - "3111:3111"
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./data:/app/data

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/engine/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - iii-engine