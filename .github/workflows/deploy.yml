name: Deploy Infrastructure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  provision-ecr:
    name: Provision ECR Repositories
    runs-on: ubuntu-latest

    outputs:
      engine_repo_url: ${{ steps.tf-output.outputs.engine_repo_url }}
      caller_repo_url: ${{ steps.tf-output.outputs.caller_repo_url }}
      inference_repo_url: ${{ steps.tf-output.outputs.inference_repo_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::424522917561:role/alchemyst-devops-github-actions
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Apply ECR only
        working-directory: terraform
        run: terraform apply -auto-approve -target=module.ecr

      - name: Get ECR outputs
        id: tf-output
        working-directory: terraform
        run: |
          echo "engine_repo_url=$(terraform output -raw engine_repo_url)" >> $GITHUB_OUTPUT
          echo "caller_repo_url=$(terraform output -raw caller_worker_repo_url)" >> $GITHUB_OUTPUT
          echo "inference_repo_url=$(terraform output -raw inference_worker_repo_url)" >> $GITHUB_OUTPUT

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: provision-ecr

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::424522917561:role/alchemyst-devops-github-actions
          aws-region: us-east-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push engine image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/engine/Dockerfile
          push: true
          tags: ${{ needs.provision-ecr.outputs.engine_repo_url }}:latest

      - name: Build and push caller worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/caller-worker/Dockerfile
          push: true
          tags: ${{ needs.provision-ecr.outputs.caller_repo_url }}:latest

      - name: Build and push inference worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/inference-worker/Dockerfile
          push: true
          tags: ${{ needs.provision-ecr.outputs.inference_repo_url }}:latest

  deploy-infrastructure:
    name: Deploy Full Infrastructure
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::424522917561:role/alchemyst-devops-github-actions
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve